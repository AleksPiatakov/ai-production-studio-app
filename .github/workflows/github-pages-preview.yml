name: Publish approved UI preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Run tests
        run: npm test
      - name: Build isolated, synthetic-data preview
        run: node scripts/build-preview.js
      - name: Verify static entry and required assets
        run: |
          test -s preview-dist/index.html
          grep -q 'AI Production Studio' preview-dist/index.html
          test -f preview-dist/project-dashboard.js
          test -f preview-dist/script-editor-demo.js
          test -f preview-dist/approved-script-format.js
          touch preview-dist/.nojekyll
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: preview-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
