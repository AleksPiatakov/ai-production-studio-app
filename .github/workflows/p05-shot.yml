name: P-05 Approved Shot Editor
on:
  pull_request:
    paths:
      - 'public/**'
      - 'preview/**'
      - 'scripts/verify-shot-p05.js'
      - 'scripts/build-preview.js'
      - '.github/workflows/p05-shot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: npm test
      - name: Build static demo
        run: node scripts/build-preview.js
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Start app
        run: |
          node server/index.js > /tmp/p05-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/api/health >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/api/health
      - name: Browser acceptance
        run: node scripts/verify-shot-p05.js
      - name: Archive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p05-approved-shot-screenshots
          path: preview-screenshots/p05-*.png
          retention-days: 14
          if-no-files-found: warn
      - name: Diagnostics
        if: failure()
        run: tail -80 /tmp/p05-server.log
