name: P-02 Approved Script Editor

on:
  pull_request:
    paths:
      - 'public/**'
      - 'scripts/verify-script-editor-p02.js'
      - '.github/workflows/p02-script-editor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  script-editor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test production foundation
        run: npm test
      - name: Install headless browser
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Start isolated server
        run: |
          node server/index.js > /tmp/p02-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/api/health >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/api/health
      - name: Build safe online UI preview
        run: node scripts/build-preview.js
      - name: Validate approved P-02 modes
        run: node scripts/verify-script-editor-p02.js
      - name: Archive automatic editor screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: approved-p02-editor-visuals
          path: preview-screenshots/p02-*.png
          retention-days: 14
          if-no-files-found: warn
      - name: Diagnose on failure
        if: failure()
        run: tail -80 /tmp/p02-server.log
