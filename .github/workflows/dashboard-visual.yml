name: Dashboard UI review

on:
  pull_request:
    paths:
      - 'public/**'
      - 'server/**'
      - 'scripts/verify-dashboard-preview.js'
      - '.github/workflows/dashboard-visual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: npm test
      - name: Install browser
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Start isolated seeded local server
        run: |
          node server/index.js > /tmp/ai-studio-server.log 2>&1 &
          echo $! > /tmp/ai-studio-server.pid
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/api/health >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/api/health
      - name: Build shared online preview
        run: node scripts/build-preview.js
      - name: Visual and navigation acceptance
        run: node scripts/verify-dashboard-preview.js
      - name: Save rendered screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-project-dashboard
          path: preview-screenshots/*.png
          retention-days: 14
          if-no-files-found: warn
      - name: Server diagnostics on failure
        if: failure()
        run: tail -100 /tmp/ai-studio-server.log
