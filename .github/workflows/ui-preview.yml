name: Public-safe UI preview and screenshots

on:
  push:
    branches: [main]
    paths:
      - 'preview/**'
      - 'public/*.css'
      - 'public/*.js'
      - 'server/**'
      - 'shared/**'
      - 'test/**'
      - 'package.json'
      - 'scripts/build-preview.js'
      - '.github/workflows/ui-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-preview-checks
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate application logic
        run: npm test
      - name: Build mock-data-only static preview
        run: |
          node scripts/build-preview.js
          test -f preview-dist/index.html
          ! grep -q '/api/' preview-dist/index.html
      - name: Install Playwright for automated visual captures
        run: |
          npm_config_yes=true npx playwright@1.58.2 install --with-deps chromium
      - name: Capture desktop and mobile layout
        run: |
          mkdir -p preview-screenshots
          for screen in project script storyboard shot images voice voiceLibrary projectAssistant aiChanges media versions davinci home projects assistant models queue settings; do
            npx playwright@1.58.2 screenshot --browser chromium --viewport-size='1440,900' --wait-for-timeout=700 "file://$PWD/preview-dist/index.html?screen=$screen" "preview-screenshots/$screen-desktop.png"
          done
          npx playwright@1.58.2 screenshot --browser chromium --viewport-size='390,844' --wait-for-timeout=700 "file://$PWD/preview-dist/index.html?screen=project" preview-screenshots/project-mobile.png
          npx playwright@1.58.2 screenshot --browser chromium --viewport-size='390,844' --wait-for-timeout=700 "file://$PWD/preview-dist/index.html?screen=home" preview-screenshots/home-mobile.png
      - uses: actions/upload-artifact@v4
        with:
          name: studio-preview-screenshots
          path: preview-screenshots/*.png
          retention-days: 14
